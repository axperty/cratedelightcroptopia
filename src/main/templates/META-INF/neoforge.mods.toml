modLoader="javafml"
issueTrackerURL = "https://github.com/axperty/cratedelightcroptopia/issues"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL = "https://github.com/axperty/cratedelightcroptopia"
logoFile="assets/${mod_id}/logo.png"
description="${mod_description}"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cratedelight"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="croptopia"
type="required"
versionRange="[0,)"
ordering="NONE"
side="BOTH"